<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chùa Online · TikTok LIVE v2.0.0</title>
<meta name="description" content="Chùa online phong cách điện ảnh: điện thờ thật, phật tử áo tràng vào lễ, tặng quà thắp hương thỉnh chuông qua TikTok LIVE.">
<link rel="stylesheet" href="style.css?v=25">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#170903">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">
</head>
<body>
<div id="phone">

  <!-- ================= STAGE 2.5D ================= -->
  <main id="stage">
    <div id="world">
    <div id="bgWrap">
      <img id="bgTop" src="https://chua-online-phucvjps-projects.vercel.app/assets/backdrop-top.jpg" alt="">
      <img id="bgBot" src="https://chua-online-phucvjps-projects.vercel.app/assets/backdrop-bot.jpg" alt="">
      <div id="rays"></div>
      <div id="haloGlow"></div>
      <div class="candleGlow" id="cgL"></div>
      <div class="candleGlow" id="cgR"></div>
      <div id="smoke"></div>
      <div id="burnerGlow"></div>
    </div>

    <!-- bell hanging at right pillar -->
    <div id="bell" title="Thỉnh chuông">
      <div class="bellBeam"></div>
      <div class="bellBody">🔔</div>
    </div>

    <div id="floorLayer"></div>
    <div id="fx"></div>
    <svg id="dragon" viewBox="0 0 300 90">
      <path d="M5 60 C60 10, 110 95, 165 45 C210 5, 255 60, 295 30" fill="none" stroke="#ffd94d" stroke-width="10" stroke-linecap="round"/>
      <circle cx="295" cy="30" r="13" fill="#ffd94d"/>
      <circle cx="299" cy="26" r="3.5" fill="#7a2d00"/>
      <path d="M292 14 L286 2 M302 15 L306 3" stroke="#ffd94d" stroke-width="4" stroke-linecap="round"/>
    </svg>
    </div><!-- /#world -->

    <div class="couplet left" id="coupL">Đây là nơi thanh tịnh</div>
    <div class="couplet right" id="coupR">Vui lòng đi nhẹ nói khẽ</div>

    <header id="topbar">
      <div class="title">Chùa Online</div>
      <div class="sub">🙏 <b id="devCount">0</b> phật tử đang lễ &nbsp;✦&nbsp; Công đức: <b id="congduc">0</b> &nbsp;✦&nbsp; <span class="ver">v2.0.0</span></div>
    </header>

    <!-- thank-you banner when a gift arrives -->
    <div id="thanksBanner">
      <div id="thanksTitle">🙏 Cảm ơn sen</div>
      <div id="thanksSub"></div>
    </div>

    <!-- stage sound controls -->
    <div class="stageCtl">
      <button id="btnFs" title="Toàn màn hình">⛶</button>
      <button id="btnMusic" title="Nhạc thiền">🎵</button>
      <button id="btnVoice" title="Giọng cảm ơn">🗣️</button>
      <button id="btnNarr" title="Giảng pháp nền">📿</button>
    </div>

    <aside id="giftMenu" class="panel">
      <h3>Tặng quà để…</h3>
      <div id="giftMenuList"></div>
    </aside>

    <aside id="board" class="panel">
      <h3>Bảng Công Đức</h3>
      <ol id="boardList"></ol>
    </aside>

    <!-- bottom tier bar, like real TikTok temple lives -->
    <div id="tierBar">
      <button class="tier" data-gift="huong"><span class="ti">🪔</span><span class="tn">Dâng hương</span><span class="tp">1 xu</span></button>
      <button class="tier" data-gift="nen"><span class="ti">🙏</span><span class="tn">Lễ Phật</span><span class="tp">5 xu</span></button>
      <button class="tier" data-gift="hoasen"><span class="ti">🪷</span><span class="tn">Hoa sen</span><span class="tp">10+ xu</span></button>
    </div>

    <div id="ticker"><span id="tickerText">Nam mô A Di Đà Phật 🙏 Chùa Online mở cửa — mời sen vào lễ</span></div>
  </main>

  <!-- ================= SIMULATOR ================= -->
</div>
<script src="app.js?v=38"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="three3d.js?v=7"></script>
</body>
</html>
